<!doctype html>
<html lang="zh-CN">

<title>史莱姆穿迷宫</title>
<style>
:root{--bg:#0d181e;--panel:#15262e;--border:#2a4148;--text:#e5f2e9;--muted:#99afb0;--mint:#a1e7bb;--gold:#ecd095;--radius:20px;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--text);background:var(--bg)}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 10% 0%,#1c383f55,transparent 55%);min-height:100vh}button,select,input{font:inherit}button,select{color:var(--text)}button{cursor:pointer;transition:background .16s,border-color .16s,transform .16s}button:active{transform:translateY(1px)}button:disabled{opacity:.5;cursor:default}button:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--gold);outline-offset:4px}button,select{min-height:42px}a{color:var(--mint);text-underline-offset:4px}p{margin:0;line-height:1.7}[hidden]{display:none!important}.app{max-width:1400px;margin:auto;padding:36px 40px 24px}.masthead{display:flex;justify-content:space-between;align-items:center;gap:24px;margin-bottom:32px}.brand{display:flex;align-items:center;gap:17px}.brand-mark{width:49px;height:46px;background:linear-gradient(145deg,#c0f6ce,#54b99c);border-radius:48% 51% 37% 39%;position:relative;box-shadow:inset 0 1px 0 #e1ffe2,0 5px 20px #0002;transform:rotate(-7deg);flex-shrink:0}.brand-mark:before{content:"";position:absolute;width:4px;height:6px;border-radius:50%;background:#1e5548;top:19px;left:15px;box-shadow:15px 0 #1e5548}.brand-mark:after{content:"";position:absolute;width:10px;height:5px;border:2px solid #1e5548;border-top:0;border-radius:0 0 10px 10px;left:20px;top:27px}.eyebrow{font-size:10px;letter-spacing:2.2px;color:var(--muted);margin-bottom:5px}h1{font-size:27px;letter-spacing:1px;margin:0;font-weight:650}.tagline{font-size:13px;color:var(--muted);letter-spacing:1px}.mode-switch{display:inline-flex;background:#091319;border:1px solid #233941;padding:5px;border-radius:13px;gap:4px;margin-bottom:24px}.mode-switch button{border:0;border-radius:9px;background:transparent;padding:0 25px;font-size:14px;color:var(--muted)}.mode-switch button:hover{background:#20343b;color:var(--text)}.mode-switch button.active{background:#263f43;color:var(--mint);box-shadow:0 2px 6px #0002}.workspace{display:grid;grid-template-columns:minmax(0,1fr) 264px;gap:24px;align-items:start}.stage{min-width:0;border:1px solid var(--border);border-radius:var(--radius);background:#12242c;overflow:hidden;box-shadow:0 18px 55px #0002}.stage-head{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:19px 22px}.stage-label{display:flex;align-items:center;gap:12px}.stage-number{display:grid;place-items:center;width:30px;height:30px;border:1px solid #3c5659;border-radius:9px;color:var(--mint);font-size:12px;font-variant-numeric:tabular-nums}h2{font-size:15px;font-weight:550;margin:0}.state{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:7px;white-space:nowrap}.state:before{content:"";width:5px;height:5px;border-radius:50%;background:var(--mint)}canvas{display:block;width:100%;height:auto;aspect-ratio:16/9;background:#102631;touch-action:none;cursor:grab;border-top:1px solid #294249;border-bottom:1px solid #294249}canvas:active{cursor:grabbing}.stage-bottom{padding:16px 22px 17px;min-height:65px;display:flex;align-items:center;gap:11px}.status-dot{width:6px;height:6px;border-radius:50%;background:var(--gold);flex-shrink:0}#status{font-size:12px;color:#b9cbca;font-variant-numeric:tabular-nums;line-height:1.6}.toolbar{display:flex;align-items:center;gap:9px;padding:15px 0}.button{border:1px solid #2d454e;background:#172b34;border-radius:10px;padding:0 16px;font-size:13px;display:inline-flex;align-items:center;justify-content:center;gap:8px}.button:hover{background:#243c43;border-color:#53716b}.button svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.button.primary{background:var(--mint);border-color:var(--mint);color:#173f32;font-weight:600}.button.primary:hover{background:#b8f1cc}.button.full{width:100%}.button.quiet{background:transparent;border-color:#2a4148;color:#afc3c1}.button.quiet:hover{background:#1b3038}.spacer{flex:1}.sidebar{display:flex;flex-direction:column;gap:16px}.side-card{border:1px solid var(--border);border-radius:var(--radius);padding:21px;background:var(--panel)}.section-title{font-size:12px;color:var(--muted);letter-spacing:1px;display:block;margin:0 0 17px}.field{display:flex;flex-direction:column;gap:10px;margin-bottom:18px}.field>span{font-size:12px;color:var(--muted)}select{width:100%;border:1px solid #385259;border-radius:10px;background:#0f212a;padding:0 10px;font-size:13px;cursor:pointer}.route-description{font-size:12px;line-height:1.8;color:#a8bfbd;margin:14px 0 19px;min-height:44px}.next-button{margin-top:9px}.preset-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}.preset-grid button:last-child{grid-column:1/-1}.range-labels{display:flex;justify-content:space-between;font-size:11px;color:#a5bcb8;margin-top:3px}.range-wrap input{width:100%;accent-color:var(--mint);cursor:pointer;margin:3px 0 0;min-height:24px}.check{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:12px;color:#b7cbc7;min-height:32px}.check input{accent-color:var(--mint);width:16px;height:16px;cursor:pointer;margin:0}.check+.check{margin-top:8px}details{border-top:1px solid #2d444b;padding-top:16px;margin-top:20px}summary{font-size:12px;color:#afc8c0;cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center}summary::-webkit-details-marker{display:none}summary:after{content:"+";color:var(--mint);font-size:16px}details[open] summary:after{content:"−"}details[open] summary{margin-bottom:19px}.tuning-label{margin-top:16px}.help-title{font-size:13px;color:#d1e3d8;margin-bottom:9px}.help{font-size:12px;color:var(--muted);line-height:1.9}.notice{font-size:12px;color:var(--gold);line-height:1.8;overflow-wrap:anywhere}.notice:empty{display:none}.footer{display:flex;justify-content:space-between;gap:18px;margin-top:18px;color:#69898e;font-size:11px}.footer span:last-child{color:#87a79c}#record.recording{border-color:#c7857a;color:#f2b5a6}.state[data-state="won"]{color:var(--gold)}.state[data-state="won"]:before{background:var(--gold)}

@media(max-width:1000px){.app{padding:26px 24px}.workspace{grid-template-columns:minmax(0,1fr) 230px;gap:16px}.side-card{padding:17px}.tagline{display:none}.stage-head{padding:16px}.stage-bottom{padding:13px 16px}}
@media(max-width:760px){.app{padding:23px 16px}.masthead{margin-bottom:25px}h1{font-size:23px}.brand-mark{width:45px;height:43px}.mode-switch{display:flex;margin-bottom:18px}.mode-switch button{flex:1;padding:0 12px}.workspace{grid-template-columns:1fr;gap:8px}.sidebar{display:grid;grid-template-columns:1fr 1fr;gap:12px}.side-card{border-radius:16px}.side-card:last-child{align-self:start}.stage-head{padding:14px 15px}.toolbar{padding:12px 0}.button{padding:0 12px}.footer{font-size:10px}.help{font-size:12px}}
@media(max-width:450px){.sidebar{grid-template-columns:1fr}.stage-number{width:26px;height:26px}.stage-label{gap:8px}.stage-head h2{font-size:13px}.state{font-size:10px}.eyebrow{font-size:9px}.toolbar{gap:7px}.button{padding:0 10px;font-size:12px}.footer{flex-wrap:wrap}}
@media(min-width:1000px) and (max-height:850px){.app{max-width:1180px;padding-top:22px}.masthead{margin-bottom:20px}.mode-switch{margin-bottom:18px}.stage-head{padding:12px 18px}.stage-bottom{padding:12px 18px;min-height:48px}.toolbar{padding:10px 0}.footer{margin-top:8px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

html,body{height:100%;overflow:hidden}.app{height:100vh;height:100dvh;display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;padding:22px 32px 14px;gap:16px;max-width:1500px}.masthead,.mode-switch,.footer{margin:0}.mode-switch{justify-self:start}.workspace{min-height:0;align-items:stretch}.main-column{min-height:0;display:grid;grid-template-rows:minmax(0,1fr) auto auto}.stage{min-height:0;display:grid;grid-template-rows:auto minmax(0,1fr) auto}.stage-head{padding:13px 19px}.canvas-wrap{min-width:0;min-height:0;border-block:1px solid #294249;background:#0c202b;overflow:hidden}canvas{width:100%;height:100%;aspect-ratio:auto;object-fit:contain;border:0}.stage-bottom{padding:12px 19px;min-height:48px}.toolbar{padding:11px 0 0}.notice:not(:empty){padding-top:9px}.sidebar{min-height:0;overflow:auto;scrollbar-width:thin}.side-card{padding:18px}.footer{font-size:10px}.level-progress{list-style:none;padding:0;margin:0 0 18px;display:flex;justify-content:space-between;gap:8px}.level-progress li{display:grid;place-items:center;width:36px;height:36px;border:1px solid #36505a;border-radius:50%;font-size:12px;color:#6f8f95;font-variant-numeric:tabular-nums}.level-progress li[data-state="current"]{color:#173f32;background:var(--mint);border-color:var(--mint);box-shadow:0 0 0 4px #a1e7bb0c}.level-progress li[data-state="done"]{color:var(--mint);border-color:#79b699;background:#203c36}dialog{width:min(400px,calc(100vw - 32px));max-height:calc(100dvh - 32px);overflow:auto;padding:32px;border:1px solid #45635d;border-radius:24px;color:var(--text);background:#152b32;text-align:center;box-shadow:0 24px 100px #0008}dialog::backdrop{background:#051119bd;backdrop-filter:blur(5px)}.completion-mark{width:58px;height:58px;display:grid;place-items:center;background:var(--mint);color:#184b35;border-radius:50%;font-size:28px;margin:0 auto 22px}dialog h2{font-size:24px;margin:10px 0 13px}#completionText{font-size:13px;color:#b5cdc3}.completion-actions{display:grid;gap:10px;margin-top:25px}canvas:focus-visible{outline:2px solid var(--gold);outline-offset:-3px}
@media(max-height:760px){.app{padding-top:15px;gap:12px}.masthead h1{font-size:23px}.brand-mark{width:43px;height:41px}.brand{gap:13px}.sidebar .side-card:last-child{display:none}.stage-head{padding:10px 16px}.side-card{padding:16px}.section-title{margin-bottom:13px}.stage-bottom{min-height:42px;padding:10px 16px}.mode-switch button{min-height:35px}.footer{display:none}.app{grid-template-rows:auto auto minmax(0,1fr)}}
@media(max-width:760px){.app{padding:16px;gap:12px}.workspace{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto;gap:12px}.sidebar{display:block;max-height:31dvh;min-height:100px}.sidebar .side-card:last-child{display:none}.sidebar .side-card{padding:14px}.level-progress{justify-content:flex-start;gap:12px;margin-bottom:10px}.level-progress li{width:29px;height:29px}.route-description{min-height:0;margin:8px 0 12px}.section-title{margin-bottom:10px}.mode-switch{justify-self:stretch}.masthead h1{font-size:22px}.brand-mark{width:40px;height:39px}.eyebrow{font-size:8px}.footer{display:none}.app{grid-template-rows:auto auto minmax(0,1fr)}}
@media(max-height:520px) and (min-width:761px){.app{padding:10px 20px;gap:8px}.eyebrow,.tagline{display:none}.brand-mark{width:33px;height:32px}.brand-mark:before{top:12px;left:8px}.brand-mark:after{top:20px;left:13px}.masthead h1{font-size:20px}.mode-switch button{min-height:30px}.stage-head{padding:7px 13px}.stage-bottom{min-height:33px;padding:6px 13px}.toolbar{padding-top:7px}.button{min-height:35px}}

.feel-controls{border-top:1px solid var(--border);padding-top:18px;margin-top:20px}.feel-controls .field{gap:7px;margin-bottom:13px}.feel-controls .range-wrap{margin-bottom:9px}.feel-controls .section-title{color:var(--text);margin-bottom:14px}.side-help{padding:0 5px}.sidebar{gap:13px}.range-wrap input{height:29px;min-height:29px}.sidebar .tuning-label{padding-top:12px;margin-top:12px}.sidebar .side-help{display:none}
@media(max-height:760px){.route-description{display:none}.feel-controls{padding-top:14px;margin-top:15px}.feel-controls .field{gap:5px;margin-bottom:10px}.feel-controls .section-title{margin-bottom:10px}.level-progress{margin-bottom:13px}}
@media(max-width:760px){.sidebar{max-height:40dvh}.sidebar>.side-card{display:grid;grid-template-columns:1fr 1fr;gap:14px}.feel-controls{border:0;padding:0;margin:0}.sidebar .tuning-label{grid-column:1/-1;margin:0;padding:8px 0 0}.sidebar .tuning-label:not([open]){padding-top:0;border:0}.sidebar .route-description{display:none}.feel-controls .field{margin-bottom:7px}.feel-controls .section-title{margin-bottom:7px}.sidebar select{min-height:35px}.sidebar .check{min-height:24px}.sidebar .level-progress{gap:6px}.sidebar .section-title{font-size:11px}.sidebar .button{min-height:36px}.sidebar .feel-controls .field>span{font-size:11px}}
#performanceStats{display:block;margin-top:9px;font-size:11px;line-height:1.7;color:var(--muted);font-variant-numeric:tabular-nums}#performanceStats[hidden]{display:none}.notice[hidden]{display:none}.notice a{color:var(--mint);margin-left:8px}button:disabled{opacity:.6;cursor:wait}
</style>
</head>
<body>
<div class="app">
<header class="masthead"><div class="brand"><div class="brand-mark" aria-hidden="true"></div><div><p class="eyebrow">A LITTLE SOFT ADVENTURE</p><h1>史莱姆穿迷宫</h1></div></div><p class="tagline">挤过去，再弹回来。</p></header>
<nav class="mode-switch" aria-label="工作模式"><button id="maze" class="active" aria-pressed="true">迷宫冒险</button><button id="studio" aria-pressed="false">捏捏工作台</button></nav>
<main class="workspace">
<div class="main-column">
<section class="stage" aria-label="动画场景">
<div class="stage-head"><div class="stage-label"><span class="stage-number" id="stageNumber">01</span><h2 id="stageTitle">苔石窄门</h2></div><span class="state" id="stageState">自由探索</span></div>
<div class="canvas-wrap"><canvas width="960" height="540" tabindex="0" aria-label="按住并拖动，带史莱姆穿过迷宫"></canvas></div>
<div class="stage-bottom"><span class="status-dot" aria-hidden="true"></span><p id="status" role="status" aria-live="off">从窄口挤过去，再绕过两道高墙。</p></div>
</section>
<div class="toolbar" aria-label="播放控制">
<button class="button quiet" id="reset"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 7a6 6 0 1 1-1 5M4 3v4h4"/></svg>重新开始</button>
<button class="button quiet" id="pause">暂停</button><span class="spacer"></span><button class="button quiet" id="record">录制动画</button>
</div>
<p class="notice" id="noticeWrap" hidden role="status"><span id="notice"></span> <a id="recordingDownload" hidden>保存上次录制</a></p>
</div>
<aside class="sidebar" aria-label="关卡与设置">
<section class="side-card">
<div id="levelControls"><p class="section-title">四关旅程</p><ol class="level-progress" aria-label="关卡进度"><li id="progress1" data-state="current">01</li><li id="progress2">02</li><li id="progress3">03</li><li id="progress4">04</li></ol><p class="route-description" id="levelDescription">从窄口挤过去，再绕过两道高墙。</p><button class="button primary full" id="tour">自动演示</button></div>
<div id="ffdControls" hidden><p class="section-title">捏一个新模样</p><div class="preset-grid"><button class="button" data-preset="squash">挤压</button><button class="button" data-preset="stretch">伸展</button><button class="button" data-preset="bend">局部弯曲</button></div><button class="button primary full" id="keys">播放起跳动作</button></div>
<div id="physicsControls" class="feel-controls"><p class="section-title">手感调节</p><label class="field"><span>软体风格</span><select id="solver"><option value="pbd">约束软体</option><option value="spring">弹簧软体</option></select></label><div class="field range-wrap"><span>软硬程度</span><input aria-label="结构刚度" id="soft" type="range" min="0.05" max="0.9" step="0.05" value="0.35"><div class="range-labels"><span>像果冻</span><span>更紧实</span></div></div><label class="check">自动恢复形状<input id="recover" type="checkbox" checked></label></div>
<details class="tuning-label"><summary>观察细节</summary><label class="check">显示调试网格<input id="debug" type="checkbox"></label><output id="performanceStats" hidden aria-live="off"></output></details>
</section>
<section class="side-help"><h2 class="help-title" id="helpTitle">轻轻一拖，就出发</h2><p class="help" id="hint">按住画布引导史莱姆，松开后看它慢慢恢复。金色旗帜就是终点。</p></section>
</aside>
</main>
<footer class="footer"><span>让柔软，找到自己的路。</span><span>四座迷宫 · 一个小小的史莱姆</span></footer>
</div>
<dialog id="completion" aria-labelledby="completionTitle" aria-describedby="completionText"><div class="completion-mark" aria-hidden="true">✓</div><p class="eyebrow" id="completionStep">01 / 04</p><h2 id="completionTitle">这一关，穿过去了！</h2><p id="completionText"></p><div class="completion-actions"><button class="button primary full" id="advance" autofocus>进入下一关 →</button><button class="button quiet full" id="retry">再玩本关</button></div></dialog>
<!--SCRIPTS-->
</body>
</html>
